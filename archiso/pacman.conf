[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[catarch-testing]
SigLevel = Required DatabaseOptional
Server = https://mirror.catarch.example/$repo/os/$arch
# Server = https://mirror2.catarch.example/$repo/os/$arch
# Local development mirror example:
# Server = file:///absolute/path/to/catarch/repo/$repo/os/$arch

[catarch]
SigLevel = Required DatabaseOptional
Server = https://mirror.catarch.example/$repo/os/$arch
# Server = https://mirror2.catarch.example/$repo/os/$arch
# Local development mirror example:
# Server = file:///absolute/path/to/catarch/repo/$repo/os/$arch
